# Example reverse-proxy vhost for odin.davage.me on heimdall.
# Copy to /etc/nginx/sites-available/odin and adjust proxy_pass / server_name
# for loki (192.168.5.193) and thor (192.168.4.43).

server {
    listen 80;
    server_name odin.davage.me;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        include snippets/internal-only.conf;
        proxy_pass http://192.168.4.32:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
