# Reverse-proxy vhost template for heimdall: <name>.davage.me -> backend host.
#
# Port 80 stays open only for ACME HTTP-01; everything else redirects to HTTPS.
# Port 443 terminates TLS with a per-name Let's Encrypt cert and proxies to the
# backend, restricted to LAN / Tailscale / known admin IPs.
#
# Install as /etc/nginx/sites-available/<name> and symlink into sites-enabled.
# Replace NAME and BACKEND_IP.

server {
    listen 80;
    listen [::]:80;
    server_name NAME.davage.me;

    # Must stay reachable from the internet for certbot renewals.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;".
    # This form is required on nginx 1.22 (Debian 12).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name NAME.davage.me;

    ssl_certificate     /etc/letsencrypt/live/NAME.davage.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/NAME.davage.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        include snippets/internal-only.conf;
        proxy_pass http://BACKEND_IP:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
