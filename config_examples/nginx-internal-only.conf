# Restrict a reverse-proxied vhost to LAN, Tailscale, and known admin IPs.
# Include this inside location / of odin/loki/thor on heimdall.
#
# Install: sudo cp nginx-internal-only.conf /etc/nginx/snippets/internal-only.conf

allow 127.0.0.1;
allow ::1;
allow 192.168.0.0/16;
allow 10.0.0.0/8;
allow 100.64.0.0/10;      # Tailscale CGNAT

# UFW "Anywhere" allowlist (admin / home WAN)
allow 2.96.27.232;
allow 94.126.212.170;
allow 82.28.51.224;
allow 78.145.12.246;
allow 31.94.24.165;
allow 198.99.231.34;
allow 31.94.61.1;
allow 31.94.14.72;
allow 94.126.212.171;

deny all;
