# Fail2Ban jail for UFW SSH blocks
# Location: /etc/fail2ban/jail.d/ufw-ssh.conf
# This reports UFW-blocked SSH attacks to abuseipdb without additional banning

[ufw-ssh]
enabled  = true
filter   = ufw-ssh-block
# Use journalctl/systemd backend to read kernel logs
backend  = systemd
# Monitor kernel/system logs where UFW logs appear
journalmatch = _TRANSPORT=kernel
# How many UFW blocks before reporting to abuseipdb
maxretry = 3
# Time window - 3 blocks in 10 minutes = report
findtime = 600
# Don't actually ban (UFW already blocks) - just report to abuseipdb
bantime  = 1
# Report to abuseipdb only (no iptables action needed)
action   = %(action_abuseipdb)s[abuseipdb_apikey="1ff46f49e78d7681df43f14ea971a36a733b9be888a5d3580bd19041b4ddd488c64035a624021f26", abuseipdb_category="18,22"]

