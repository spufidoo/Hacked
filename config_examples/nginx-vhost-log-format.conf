# Drop into the http {} block of nginx.conf (before access_log).
# Combined prefix is unchanged so rotated logs still parse; host= / proxy=
# are appended so HackedSSH can split home vs odin/loki/thor.

log_format vhost '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'host=$host proxy=$proxy_host';

access_log /var/log/nginx/access.log vhost;
