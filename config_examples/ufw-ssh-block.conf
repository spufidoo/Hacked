# Fail2Ban filter for UFW SSH blocks
# Location: /etc/fail2ban/filter.d/ufw-ssh-block.conf
# This monitors UFW logs and reports repeated SSH attack attempts to abuseipdb

[Definition]

# Match UFW BLOCK entries for SSH (port 22)
failregex = ^\s*\S+\s+\S+\s+\S+\s+kernel:.*\[UFW BLOCK\].*SRC=<HOST>.*DPT=22\s

ignoreregex =

# Example log lines this will match:
# Oct 23 08:20:54 heimdall kernel: [UFW BLOCK] IN=eth0 OUT= MAC=... SRC=13.86.106.3 DST=192.168.4.77 ... DPT=22 ...
# Oct 23 08:26:23 heimdall kernel: [UFW BLOCK] IN=eth0 OUT= MAC=... SRC=91.224.92.94 DST=192.168.4.77 ... DPT=22 ...

