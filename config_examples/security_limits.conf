# Security limits configuration
# Location: /etc/security/limits.conf
# These limits prevent resource exhaustion attacks

# Format:
# <domain> <type> <item> <value>
#
# domain: username, @groupname, or *
# type: soft or hard
# item: resource to limit
# value: the limit value

# ===== PROCESS LIMITS =====
# Limit number of processes per user
* soft nproc 100
* hard nproc 200

# Limit for root (allow more processes)
root soft nproc 500
root hard nproc 1000

# ===== FILE LIMITS =====
# Limit number of open files
* soft nofile 1024
* hard nofile 4096

# ===== MEMORY LIMITS =====
# Limit memory usage (in KB)
# * soft rss 102400
# * hard rss 204800

# ===== CPU LIMITS =====
# Limit CPU time (in minutes)
# * soft cpu 30
# * hard cpu 60

# ===== PRIORITY LIMITS =====
# Prevent users from setting high priority
* soft priority 10
* hard priority 20

# ===== LOGIN LIMITS =====
# Limit number of concurrent logins per user
* soft maxlogins 3
* hard maxlogins 5

# ===== FILE SIZE LIMITS =====
# Limit file size (in KB)
# * soft fsize 1048576
# * hard fsize 2097152

# ===== CORE DUMP LIMITS =====
# Disable core dumps (security measure)
* soft core 0
* hard core 0

# ===== LOCK LIMITS =====
# Limit number of file locks
* soft locks 1024
* hard locks 2048

# ===== NICE LIMITS =====
# Control process priority
* soft nice 0
* hard nice 0

# ===== END OF CONFIGURATION =====

