# Fail2Ban Filter for HackedSSH detected attacks
# Location: /etc/fail2ban/filter.d/hackedssh.conf
# This filter catches IPs that HackedSSH has identified as attackers

[Definition]

# Match log entries from HackedSSH that indicate attack attempts
failregex = HackedSSH.*(?:attack|attempt|failed|unauthorized).*from.*<HOST>
            HackedSSH.*Failed.*<HOST>
            HackedSSH.*Invalid.*<HOST>
            HackedSSH.*Unauthorized.*<HOST>
            HackedSSH.*Critical.*<HOST>

ignoreregex =

[Init]
journalmatch = _SYSTEMD_UNIT=hackedssh.service + _COMM=HackedSSH

